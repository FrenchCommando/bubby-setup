services:
  nginx_aiohttp_service:
    build: ./buzzer
    restart: unless-stopped
    volumes:
      - ~/buzzer:/buzzerlog
    environment:
      TARGET_PORT: 1340
    expose:
      - 5000
  nginx:
    build: ./nginx
    restart: always
    ports:
      - 1338:1338
    depends_on:
      - nginx_aiohttp_service
