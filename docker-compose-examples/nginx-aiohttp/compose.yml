services:
  nginx_aiohttp_service:
    build: ./buzzer
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ~/buzzer:/buzzerlog    
    expose:
      - 5000
  nginx:
    build: ./nginx
    restart: always
    ports:
      - 1338:1338
    depends_on:
      - nginx_aiohttp_service
